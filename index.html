<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PunchMeter Pro - Mobile & BWT901CL</title>
    <style>
        /* Base de la page adaptée au tactile */
        body { 
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; 
            text-align: center; 
            background: #121212; 
            color: #f0f0f0; 
            padding: 10px;
            margin: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        /* Cartes responsives */
        .card { 
            background: #1e1e1e; 
            padding: 20px 15px; 
            border-radius: 16px; 
            max-width: 100%; 
            margin: 12px auto; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.6); 
            border: 1px solid #2a2a2a; 
            box-sizing: border-box;
        }

        h1 { 
            color: #00ffcc; 
            margin-top: 0; 
            font-size: 1.8rem; 
        }

        h3 {
            margin-top: 0;
            font-size: 1.2rem;
            color: #aaa;
        }
        
        /* Conteneur de stats ajusté pour 3 colonnes */
        .stats-container { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin: 25px 0; 
            gap: 5px;
        }

        .score-box { 
            flex: 1; 
            padding: 5px 2px;
        }

        .score-label { 
            font-size: 0.75rem; 
            color: #888; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            margin-bottom: 5px;
        }

        /* Chiffres sans virgules */
        .score { 
            font-size: 2.8rem; 
            font-weight: bold; 
            color: #ff3366; 
            line-height: 1.1;
        }

        .record { 
            font-size: 2.4rem; 
            font-weight: bold; 
            color: #ffcc00; 
            line-height: 1.1;
        }

        .reaction-val {
            font-size: 2.4rem; 
            font-weight: bold; 
            color: #00ffcc; 
            line-height: 1.1;
        }

        /* Formulaires et listes */
        label { 
            display: block; 
            margin: 18px 0 8px; 
            font-weight: bold; 
            text-align: left; 
            font-size: 1rem;
        }

        select { 
            width: 100%; 
            padding: 14px; 
            font-size: 1rem;
            border-radius: 8px; 
            border: none; 
            background: #2a2a2a; 
            color: white; 
            box-sizing: border-box;
            appearance: none; 
        }

        input[type="range"] { 
            width: 100%; 
            margin: 15px 0;
            height: 8px;
            border-radius: 5px;
            background: #2a2a2a;
        }

        /* Bouton d'action principal tactile et dynamique */
        button { 
            background: #00ffcc; 
            color: #121212; 
            border: none; 
            padding: 18px 30px; 
            font-size: 1.2rem; 
            font-weight: bold; 
            border-radius: 12px; 
            cursor: pointer; 
            width: 100%; 
            box-shadow: 0 4px 10px rgba(0, 255, 204, 0.2);
            transition: background 0.2s, color 0.2s;
        }

        /* Bouton Bluetooth spécifique */
        button.ble-btn {
            background: #ffcc00;
            margin-bottom: 12px;
            box-shadow: 0 4px 10px rgba(255, 204, 0, 0.2);
        }

        button.ble-connecte {
            background: #1a3a3a;
            color: #00ffcc;
            border: 1px solid #00ffcc;
            box-shadow: none;
        }

        /* Style quand le système est actif (Bouton d'arrêt) */
        button.actif {
            background: #ff3366;
            color: white;
            box-shadow: 0 4px 10px rgba(255, 51, 102, 0.2);
        }

        button:active { 
            transform: scale(0.98); 
        }

        button:disabled {
            background: #444;
            color: #666;
            cursor: not-allowed;
            box-shadow: none;
        }

        .info { 
            color: #aaa; 
            font-size: 0.9rem; 
            text-align: left;
            margin-top: 5px;
        }
        
        #statut {
            font-size: 1.1rem;
            color: #ffcc00;
            font-weight: 500;
            margin: 15px 0;
        }

        /* Style de l'accordéon natif */
        details {
            width: 100%;
            text-align: left;
        }
        summary {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            font-size: 1.2rem;
            font-weight: bold;
            color: #aaa;
            list-style: none;
            outline: none;
        }
        summary::-webkit-details-marker {
            display: none;
        }
        .chevron {
            font-size: 1rem;
            color: #00ffcc;
            transition: transform 0.2s ease;
        }
        details[open] .chevron {
            transform: rotate(180deg);
        }
        .details-content {
            margin-top: 15px;
        }

        /* Historique */
        .liste-historique { list-style: none; padding: 0; margin: 15px 0 0 0; text-align: left; }
        .liste-historique li { 
            padding: 14px; 
            background: #2a2a2a; 
            margin-bottom: 8px; 
            border-radius: 8px; 
            display: flex; 
            justify-content: space-between; 
            font-size: 1rem;
            border-left: 5px solid #00ffcc; 
        }
        .liste-historique li:first-child { background: #333; font-weight: bold; border-left-color: #ff3366; }
    </style>
</head>
<body>

    <div class="card">
        <h1>PunchMeter Pro 🥊</h1>
        
        <div class="stats-container">
            <div class="score-box">
                <div class="score-label">Dernier Coup</div>
                <div class="score" id="affichageScore">0</div>
            </div>
            <div class="score-box" style="border-left: 1px solid #333; border-right: 1px solid #333;">
                <div class="score-label">⏱️ Réaction</div>
                <div class="reaction-val" id="affichageReaction">-.---s</div>
            </div>
            <div class="score-box">
                <div class="score-label">🏆 Record</div>
                <div class="record" id="affichageRecord">0</div>
            </div>
        </div>

        <p id="statut">Capteur BWT901CL non connecté.</p>
        <button id="btnBluetooth" class="ble-btn">CONNECTER BWT901CL</button>
        <button id="btnConfiguration" disabled>DÉMARRER</button>
    </div>

    <div class="card">
        <h3>📋 Historique (5 derniers)</h3>
        <ul id="listeHistorique" class="liste-historique">
            <li style="border: none; color: #666; justify-content: center; background: transparent;">Aucun coup enregistré.</li>
        </ul>
    </div>

    <div class="card">
        <details>
            <summary>
                <span>⚙️ Réglages & Sensibilité</span>
                <span class="chevron">▼</span>
            </summary>
            <div class="details-content">
                <label for="selectMode">Mode de fonctionnement :</label>
                <select id="selectMode">
                    <option value="libre">Entraînement Libre (Continu)</option>
                    <option value="reaction">Test de Réaction (Signal Continu Automatique)</option>
                    <option value="combo">Test d'Enchaînement (Combo Aléatoire)</option>
                </select>

                <div id="wrapperCombo" style="display: none;">
                    <label for="selectNbCoupsCombo">Nombre de coups du combo :</label>
                    <select id="selectNbCoupsCombo">
                        <option value="1">1 coup</option>
                        <option value="2">2 coups</option>
                        <option value="3" selected>3 coups</option>
                        <option value="4">4 coups</option>
                        <option value="5">5 coups</option>
                        <option value="6">6 coups</option>
                    </select>
                </div>

                <label for="selectSupport">Support utilisé :</label>
                <select id="selectSupport">
                    <option value="sac">Sac Suspendu (Mobile)</option>
                    <option value="mur">Cible Murale (Fixe)</option>
                </select>

                <label for="sliderSensibilite">Seuil de choc :</label>
                <input type="range" id="sliderSensibilite" min="5" max="50" value="15">
                <div class="info">Seuil actuel : <span id="valeurSeuil" style="color: #00ffcc; font-weight:bold;">15</span> m/s²</div>
            </div>
        </details>
    </div>

    <script>
        let seuilDetection = 15; 
        let dureeFenetreImpact = 100; 
        let tempsAttenteAntiRebond = 1000; 
        
        let modeActuel = 'libre'; 
        let systemeActif = false; 
        let enTrainDeFrapper = false;
        let maxImpact = 0;
        let recordSession = 0;
        let historiqueCoups = [];
        let compteurCoups = 0;

        // Gestion de la réaction
        let sequenceEnCours = false;
        let signalDonne = false;
        let tempsSignal = 0;
        let timeoutSignal = null;

        // Gestion du Mode Combo
        let nombreCoupsCombo = 3;
        let coupsRestantsCombo = 0;
        let comboEnCours = false;

        // Variables Web Bluetooth et Buffer de streaming
        let deviceBluetooth = null;
        let caractéristiqueBluetooth = null;
        let decodageBuffer = [];

        // UUIDs de communication standards des modules WitMotion
        const WITMOTION_SERVICES = ['0000ffe0-0000-1000-8000-00805f9b34fb', '49535343-fe7d-4ae5-8fa9-9fafd205e455'];

        const slider = document.getElementById('sliderSensibilite');
        const valeurSeuilText = document.getElementById('valeurSeuil');
        const selectSupport = document.getElementById('selectSupport');
        const selectMode = document.getElementById('selectMode');
        const wrapperCombo = document.getElementById('wrapperCombo');
        const selectNbCoupsCombo = document.getElementById('selectNbCoupsCombo');
        const affichageScore = document.getElementById('affichageScore');
        const affichageReaction = document.getElementById('affichageReaction');
        const affichageRecord = document.getElementById('affichageRecord');
        const listeHistorique = document.getElementById('listeHistorique');
        const statut = document.getElementById('statut');
        const btnConfig = document.getElementById('btnConfiguration');
        const btnBluetooth = document.getElementById('btnBluetooth');

        slider.addEventListener('input', (e) => {
            seuilDetection = parseFloat(e.target.value);
            valeurSeuilText.innerText = seuilDetection;
        });

        selectSupport.addEventListener('change', (e) => {
            if (e.target.value === 'sac') {
                dureeFenetreImpact = 100;    
                tempsAttenteAntiRebond = 1000; 
                slider.value = 15;
            } else if (e.target.value === 'mur') {
                dureeFenetreImpact = 30;     
                tempsAttenteAntiRebond = 500;  
                slider.value = 30;           
            }
            seuilDetection = parseFloat(slider.value);
            valeurSeuilText.innerText = seuilDetection;
        });

        selectMode.addEventListener('change', (e) => {
            modeActuel = e.target.value;
            if (modeActuel === 'combo') {
                wrapperCombo.style.display = 'block';
            } else {
                wrapperCombo.style.display = 'none';
            }
            arreterSysteme();
        });

        selectNbCoupsCombo.addEventListener('change', (e) => {
            nombreCoupsCombo = parseInt(e.target.value);
        });

        function annoncerTexte(texte) {
            let message = new SpeechSynthesisUtterance(texte);
            message.lang = 'fr-FR';
            message.rate = 1.3; 
            window.speechSynthesis.speak(message);
        }

        // --- GESTION DU BLUETOOTH ---
        btnBluetooth.addEventListener('click', async () => {
            if (deviceBluetooth && deviceBluetooth.gatt.connected) {
                deviceBluetooth.gatt.disconnect();
                return;
            }

            try {
                statut.innerText = "Recherche du BWT901CL...";
                statut.style.color = "#ffcc00";

                deviceBluetooth = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: WITMOTION_SERVICES
                });

                statut.innerText = "Connexion au capteur...";
                const server = await deviceBluetooth.gatt.connect();

                statut.innerText = "Recherche des flux de données...";
                let service = null;
                
                for (const uuid of WITMOTION_SERVICES) {
                    try {
                        service = await server.getPrimaryService(uuid);
                        if (service) break;
                    } catch (e) { /* continue */ }
                }

                if (!service) throw new Error("Service GATT introuvable.");

                const characteristics = await service.getCharacteristics();
                caractéristiqueBluetooth = characteristics.find(c => c.properties.notify);

                if (!caractéristiqueBluetooth) throw new Error("Flux de notification introuvable.");

                await caractéristiqueBluetooth.startNotifications();
                caractéristiqueBluetooth.addEventListener('characteristicvaluechanged', accumulerEtFiltrerTrame);
                deviceBluetooth.addEventListener('gattserverdisconnected', onBluetoothDisconnected);

                statut.innerText = "BWT901CL Connecté. Cliquez sur DÉMARRER !";
                statut.style.color = "#00ffcc";
                btnBluetooth.innerText = "DÉCONNECTER LE CAPTEUR";
                btnBluetooth.classList.add('ble-connecte');
                btnConfig.disabled = false;

            } catch (error) {
                console.error(error);
                statut.innerText = "Erreur de connexion : " + error.message;
                statut.style.color = "#ff3366";
                if (deviceBluetooth) deviceBluetooth.gatt.disconnect();
            }
        });

        function onBluetoothDisconnected() {
            statut.innerText = "Capteur déconnecté.";
            statut.style.color = "#ff3366";
            btnBluetooth.innerText = "CONNECTER BWT901CL";
            btnBluetooth.classList.remove('ble-connecte');
            btnConfig.disabled = true;
            arreterSysteme();
        }

        // Reconstitution d'un entier signé 16 bits à partir de 2 octets (Little Endian)
        function convertirEnInt16(low, high) {
            let val = (high << 8) | low;
            return val & 0x8000 ? val - 65536 : val;
        }

        // Ajout des données au buffer glissant pour éviter les pertes liées au découpage Bluetooth MTU
        function accumulerEtFiltrerTrame(event) {
            const value = event.target.value;
            for (let i = 0; i < value.byteLength; i++) {
                decodageBuffer.push(value.getUint8(i));
            }

            // Si l'acquisition n'est pas lancée via "DÉMARRER", on vide le buffer pour éviter d'accumuler du retard
            if (!systemeActif) {
                decodageBuffer = [];
                return;
            }

            // Analyse de l'historique du flux d'octets
            while (decodageBuffer.length >= 2) {
                // Tout paquet WitMotion valide commence par l'en-tête 0x55
                if (decodageBuffer[0] !== 0x55) {
                    decodageBuffer.shift();
                    continue;
                }

                const flagPaquet = decodageBuffer[1];

                // CAS 1 : Trame groupée BLE 5.0 (0x55 0x61) - Requis : 20 octets au total
                if (flagPaquet === 0x61) {
                    if (decodageBuffer.length < 20) break; // Paquet incomplet, on attend la suite

                    const axRaw = convertirEnInt16(decodageBuffer[2], decodageBuffer[3]);
                    const ayRaw = convertirEnInt16(decodageBuffer[4], decodageBuffer[5]);
                    const azRaw = convertirEnInt16(decodageBuffer[6], decodageBuffer[7]);

                    analyserAccelerationBrute(axRaw, ayRaw, azRaw);
                    decodageBuffer.splice(0, 20); // Nettoyage de la trame traitée
                } 
                // CAS 2 : Trame d'accélération seule BLE 4.0 (0x55 0x51) - Requis : 11 octets
                else if (flagPaquet === 0x51) {
                    if (decodageBuffer.length < 11) break; 

                    const axRaw = convertirEnInt16(decodageBuffer[2], decodageBuffer[3]);
                    const ayRaw = convertirEnInt16(decodageBuffer[4], decodageBuffer[5]);
                    const azRaw = convertirEnInt16(decodageBuffer[6], decodageBuffer[7]);

                    analyserAccelerationBrute(axRaw, ayRaw, azRaw);
                    decodageBuffer.splice(0, 11);
                } 
                // CAS 3 : Autres types de trames série redondantes (Vitesse angulaire 0x52, Angles 0x53...)
                else if (flagPaquet === 0x52 || flagPaquet === 0x53 || flagPaquet === 0x54) {
                    if (decodageBuffer.length < 11) break; 
                    decodageBuffer.splice(0, 11); // On ignore les angles pour libérer de la mémoire
                } 
                else {
                    // En-tête invalide ou corrompu
                    decodageBuffer.shift();
                }
            }
        }

        function analyserAccelerationBrute(axRaw, ayRaw, azRaw) {
            // Formule constructeur WitMotion (Échelle par défaut à ±16g) convertie en m/s²
            const ax = (axRaw / 32768.0) * 16.0 * 9.80665;
            const ay = (ayRaw / 32768.0) * 16.0 * 9.80665;
            const az = (azRaw / 32768.0) * 16.0 * 9.80665;

            const magnitudeTotale = Math.sqrt(ax**2 + ay**2 + az**2);

            // Soustraction de la gravité terrestre (9.81 m/s²) pour isoler l'impact dynamique pur
            let forceLineaire = magnitudeTotale - 9.80665;
            if (forceLineaire < 0) forceLineaire = 0;

            traiterAnalyseImpact(forceLineaire);
        }

        // --- MOTEUR DE TRAITEMENT ET ANALYSE DE L'IMPACT ---
        function traiterAnalyseImpact(forceInstantanee) {
            if (modeActuel === 'reaction' && sequenceEnCours && !signalDonne) {
                if (forceInstantanee > seuilDetection) {
                    clearTimeout(timeoutSignal);
                    sequenceEnCours = false;
                    statut.innerText = "❌ FAUX DÉPART !";
                    statut.style.color = "#ff3366";
                    annoncerTexte("Faux départ");
                    
                    setTimeout(() => {
                        if (systemeActif && modeActuel === 'reaction') lancerSequenceReaction();
                    }, 2000);
                }
                return; 
            }

            if (modeActuel === 'libre' || (modeActuel === 'reaction' && signalDonne) || (modeActuel === 'combo' && comboEnCours)) {
                if (!enTrainDeFrapper && forceInstantanee > seuilDetection) {
                    enTrainDeFrapper = true;
                    maxImpact = forceInstantanee;
                    statut.innerText = "💥 IMPACT !";
                    statut.style.color = "#ff3366";

                    let tempsReactionCalcule = 0;
                    if (modeActuel === 'reaction' || modeActuel === 'combo') {
                        tempsReactionCalcule = (performance.now() - tempsSignal) / 1000;
                    }

                    setTimeout(() => {
                        let scoreArrondi = Math.round(maxImpact); 
                        affichageScore.innerText = scoreArrondi;
                        
                        if (modeActuel === 'reaction' || modeActuel === 'combo') {
                            affichageReaction.innerText = tempsReactionCalcule.toFixed(3) + "s";
                        } else {
                            affichageReaction.innerText = "-.---s";
                        }
                        
                        if (scoreArrondi > recordSession) {
                            recordSession = scoreArrondi;
                            affichageRecord.innerText = recordSession;
                            if (modeActuel !== 'combo') annoncerTexte("Record " + scoreArrondi);
                        } else {
                            if (modeActuel !== 'combo') annoncerTexte(scoreArrondi.toString());
                        }

                        compteurCoups++;
                        historiqueCoups.unshift({
                            numero: compteurCoups,
                            force: scoreArrondi,
                            reaction: (modeActuel === 'reaction' || modeActuel === 'combo') ? tempsReactionCalcule.toFixed(3) : null
                        });

                        if (historiqueCoups.length > 5) {
                            historiqueCoups.pop();
                        }
                        
                        listeHistorique.innerHTML = historiqueCoups.map((coup) => {
                            let details = `${coup.force} m/s²`;
                            if (coup.reaction) details += ` / ⏱️ ${coup.reaction}s`;
                            return `<li><span>Coup n°${coup.numero}</span> <b>${details}</b></li>`;
                        }).join('');

                        setTimeout(() => {
                            enTrainDeFrapper = false;
                            if (systemeActif) {
                                if (modeActuel === 'libre') {
                                    statut.innerText = "En attente du coup suivant...";
                                    statut.style.color = "#00ffcc";
                                } else if (modeActuel === 'reaction') {
                                    lancerSequenceReaction();
                                } else if (modeActuel === 'combo') {
                                    coupsRestantsCombo--;
                                    if (coupsRestantsCombo > 0) {
                                        annoncerProchainCoupCombo();
                                    } else {
                                        statut.innerText = "Enchaînement terminé !";
                                        statut.style.color = "#00ffcc";
                                        annoncerTexte("Enchaînement terminé");
                                        setTimeout(() => {
                                            if (systemeActif && modeActuel === 'combo') lancerSequenceCombo();
                                        }, 2500);
                                    }
                                }
                            }
                        }, tempsAttenteAntiRebond);

                    }, dureeFenetreImpact);
                } 
                else if (enTrainDeFrapper && forceInstantanee > maxImpact) {
                    maxImpact = forceInstantanee;
                }
            }
        }

        // Contrôle de l'acquisition session globale (Marche / Arrêt)
        btnConfig.addEventListener('click', () => {
            if (!deviceBluetooth || !deviceBluetooth.gatt.connected) {
                statut.innerText = "❌ Capteur Bluetooth non connecté.";
                statut.style.color = "#ff3366";
                return;
            }

            if (!systemeActif) {
                systemeActif = true;
                decodageBuffer = []; // Remise à zéro du buffer
                btnConfig.innerText = "ARRÊTER";
                btnConfig.classList.add('actif');

                if (modeActuel === 'libre') {
                    annoncerTexte("C'est parti");
                    statut.innerText = "Analyse en cours... Frappez !";
                    statut.style.color = "#00ffcc";
                } else if (modeActuel === 'reaction') {
                    lancerSequenceReaction();
                } else if (modeActuel === 'combo') {
                    lancerSequenceCombo();
                }
            } else {
                arreterSysteme();
            }
        });

        function arreterSysteme() {
            systemeActif = false;
            sequenceEnCours = false;
            signalDonne = false;
            enTrainDeFrapper = false;
            comboEnCours = false;
            if (timeoutSignal) clearTimeout(timeoutSignal);
            
            btnConfig.innerText = "DÉMARRER";
            btnConfig.classList.remove('actif');
            
            if (deviceBluetooth && deviceBluetooth.gatt.connected) {
                if (modeActuel === 'libre') statut.innerText = "Prêt à démarrer.";
                else if (modeActuel === 'reaction') statut.innerText = "Prêt pour le test de réaction.";
                else statut.innerText = "Prêt pour le mode combo.";
            } else {
                statut.innerText = "Capteur BWT901CL non connecté.";
            }
            statut.style.color = "#00ffcc";
        }

        function lancerSequenceReaction() {
            if (!systemeActif) return;

            sequenceEnCours = true;
            signalDonne = false;
            enTrainDeFrapper = false;
            
            statut.innerText = "Attendez le signal...";
            statut.style.color = "#ffcc00";
            
            let delaiAleatoire = 1500 + Math.random() * 3500;
            
            timeoutSignal = setTimeout(() => {
                if (!systemeActif || !sequenceEnCours) return; 
                
                signalDonne = true;
                tempsSignal = performance.now();
                statut.innerText = "💥 GO ! FRAPPEZ !";
                statut.style.color = "#00ff33"; 
                annoncerTexte("Allez");
            }, delaiAleatoire);
        }

        function lancerSequenceCombo() {
            if (!systemeActif) return;
            comboEnCours = true;
            coupsRestantsCombo = nombreCoupsCombo;
            statut.innerText = "Préparez-vous...";
            statut.style.color = "#ffcc00";
            
            setTimeout(() => {
                if (!systemeActif || !comboEnCours) return;
                annoncerProchainCoupCombo();
            }, 1500);
        }

        function annoncerProchainCoupCombo() {
            let chiffreAleatoire = Math.floor(Math.random() * 6) + 1;
            let coupIndex = nombreCoupsCombo - coupsRestantsCombo + 1;
            statut.innerText = `🔥 CIBLE : Chiffre ${chiffreAleatoire} (${coupIndex}/${nombreCoupsCombo})`;
            statut.style.color = "#00ff33";
            
            tempsSignal = performance.now(); 
            annoncerTexte(chiffreAleatoire.toString());
        }
    </script>
</body>
</html>
